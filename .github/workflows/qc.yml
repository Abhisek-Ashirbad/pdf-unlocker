name: Python Code Quality Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Install xvfb to run structural GUI tests on a headless Linux runner
        sudo apt-get install -y python3-tk xvfb

    - name: Install Application and Testing Tools
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-mock pytest-cov

    - name: Run Test Suite with Coverage Strict Constraints
      run: |
        # xvfb-run hosts a virtual display layout so Tkinter initialization succeeds
        xvfb-run pytest --cov=pdf_unlocker --cov-report=term-missing --cov-fail-under=100

    - name: Upload HTML Coverage Report Dashboard
      if: always() # Ensures the dashboard uploads even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: html-coverage-report
        path: htmlcov/
