name: Publish to TestPyPI

on:
  push:
    # Triggers publishing whenever a new version release tag is pushed
    tags:
      - 'v*'

jobs:
  build-n-publish:
    name: Build distribution and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://pypi.org
    permissions:
      # CRITICAL: This permission is required for Trusted Publishing OIDC authentication
      id-token: write

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Tooling
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build Source and Binary Distributions
      run: |
        # Creates source archive (.tar.gz) and wheel (.whl) inside dist/
        python -m build

    - name: Publish Package to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Directs the upload step to targets the testing ecosystem URL
        repository-url: https://test.pypi.org
